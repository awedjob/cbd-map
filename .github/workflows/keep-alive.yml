name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 12 * * *'   # Daily at 12:17 UTC (every 5 days wasn't enough; project paused Sep 2026)
  workflow_dispatch:          # Allows you to run it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://zynbfeqjkafgcaguoqbd.supabase.co/rest/v1
          KEY: sb_publishable_Rz-sbZJDOFamXlve5ayMjw_4x7wB1F3
        run: |
          # --fail makes non-2xx responses fail the job so a paused project shows up as a red run
          for table in parcels history; do
            code=$(curl -sS --fail --retry 3 --retry-delay 10 -o /dev/null -w "%{http_code}" \
              "$URL/$table?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$table: HTTP $code"
          done
